name: Check MyPianow
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mypianow-dist
          path: dist

  browser-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome msedge
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-usb-browser-report
          path: test-results
